<title>uFlightly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7">
<style>
/* Layout concept: native-feeling iPhone app. Large titles, inset grouped lists, boarding-pass flight cards, bottom tab bar. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#101114; --fg2:#6B6B74; --line:rgba(60,60,67,.14);
  --accent:#0A74FF; --accent-text:#0060DF; --data:#0E9F8A; --warm-ink:#B34F00; --accent-ink:#FFFFFF; --warm:#F27A0C; --good:#27A653; --bad:#E5362F;
  --fill:rgba(120,120,128,.13); --hero:#0C2748; --hero2:#1d1a62; --hero-fg:#FFFFFF; --hero-fg2:rgba(255,255,255,.66);
  --ocean:#E3ECF6; --land:#FFFFFF; --border:#C7D2E0; --grat:rgba(10,40,90,.07);
  --shadow:0 1px 2px rgba(16,17,20,.05),0 6px 20px rgba(16,17,20,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1B1C1F; --fg:#F5F5F7; --fg2:#9D9DA6; --line:rgba(255,255,255,.10);
  --accent:#4C9BFF; --accent-text:#4C9BFF; --data:#3FD0B6; --warm-ink:#FFB36B; --accent-ink:#04101F; --warm:#FF9F43; --good:#46C46F; --bad:#FF6A63;
  --fill:rgba(120,120,128,.26); --hero:#102240; --hero2:#1b1850; --ocean:#08111E; --land:#1A2536; --border:#2A384D; --grat:rgba(255,255,255,.05);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1B1C1F; --fg:#F5F5F7; --fg2:#9D9DA6; --line:rgba(255,255,255,.10);
  --accent:#4C9BFF; --accent-text:#4C9BFF; --data:#3FD0B6; --warm-ink:#FFB36B; --accent-ink:#04101F; --warm:#FF9F43; --good:#46C46F; --bad:#FF6A63;
  --fill:rgba(120,120,128,.26); --hero:#102240; --hero2:#1b1850; --ocean:#08111E; --land:#1A2536; --border:#2A384D; --grat:rgba(255,255,255,.05);
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{font-size:17px}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
body{background:var(--bg);color:var(--fg);font-size:1rem;line-height:1.35;font-family:var(--font);padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;position:relative}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-left,0px)) 112px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}

/* tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),400px);z-index:20;display:flex;gap:2px;padding:5px;border-radius:34px;background:color-mix(in srgb,var(--card) 58%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);box-shadow:0 8px 30px rgba(0,0,0,.14),inset 0 0 0 .5px color-mix(in srgb,var(--fg) 14%,transparent)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:28px;color:var(--fg2);font-size:0.647rem;font-weight:600;letter-spacing:.01em}
#tabs button[aria-selected="true"]{color:var(--accent-text);background:var(--fill)}
#tabs button[aria-selected="true"] .ic{fill:color-mix(in srgb,currentColor 22%,transparent)}
#edge-b{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:15;pointer-events:none;background:linear-gradient(to top,var(--bg) 25%,transparent)}
body[data-view="map"] #edge-b{display:none}
.navbar{position:sticky;top:0;z-index:6;height:44px;margin:0 -16px -44px;display:grid;place-items:center;font:700 1rem var(--round);opacity:0;pointer-events:none;transition:opacity .15s;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 .5px 0 var(--line)}
.navbar.on{opacity:1}
/* large header */
.large{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 1.882rem/1.1 var(--round);letter-spacing:-.02em;margin:10px 0 8px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.icon-btn.ghost{background:var(--fill);color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;margin:4px 0 10px;color:var(--fg2)}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none;color:var(--fg)}
.search input::placeholder{color:var(--fg2)}

/* year header */
.yh{position:sticky;top:44px;z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px;background:var(--bg);font-size:0.765rem;color:var(--fg2)}
.yh b{font:800 1.176rem var(--round);color:var(--fg);letter-spacing:-.01em}

/* flight card */
.fcard{display:block;width:100%;background:var(--card);border-radius:18px;padding:14px 16px 12px;margin:0 0 10px;box-shadow:var(--shadow);position:relative}
.fcard:active{transform:scale(.99)}
.fc-top{display:flex;align-items:center;gap:8px;font-size:0.735rem;color:var(--fg2)}
.fc-top .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al{flex:none;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:grid;place-items:center;font:700 0.647rem var(--round);color:#fff;background:hsl(var(--h) 52% 42%)}
.fc-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:10px}
.code{font:800 2rem/1 var(--round);letter-spacing:-.02em}
.code small{display:block;font:500 0.735rem var(--font);letter-spacing:0;color:var(--fg2);margin-top:4px;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code.r{text-align:right}.code.r small{margin-left:auto}
.path{position:relative;height:30px;display:flex;align-items:center;justify-content:center;min-width:40px}
.path::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dotted color-mix(in srgb,var(--fg2) 55%,transparent)}
.path span{position:relative;background:var(--card);padding:0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:0.676rem;font-weight:600;color:var(--fg2)}
.path .ic{width:17px;height:17px;color:var(--data);transform:rotate(90deg);stroke-width:2.2}
.fc-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:3px 10px;font-size:0.706rem;font-weight:600;color:var(--fg2)}
.chip.star{color:var(--warm-ink)}

/* empty state */
.empty{text-align:center;padding:40px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font:800 1.294rem var(--round);margin:12px 0 0}
.empty p{color:var(--fg2);margin:0 0 10px;max-width:30ch}
.btn{display:block;width:100%;max-width:340px;padding:13px 16px;border-radius:14px;background:var(--fill);font-weight:650;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:0.824rem;border-radius:999px}

/* grouped lists */
.grp{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow)}
.gt{font-size:0.735rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2);margin:18px 6px 6px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 16px;width:100%}
.row+.row{border-top:.5px solid var(--line)}
.row label,.row>span:first-child{flex:none;min-width:0}
.row .val{margin-left:auto;color:var(--fg2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.link .val::after{content:"›";margin-left:8px;color:var(--fg2);opacity:.7}
.row input:not([type=file]),.row select{flex:1;min-width:0;border:0;background:none;text-align:right;outline:none;padding:6px 0;color:var(--fg2)}
.row input::placeholder{color:color-mix(in srgb,var(--fg2) 60%,transparent)}
.row.area{display:block}.row.area textarea{width:100%;min-height:84px;border:0;background:none;resize:vertical;outline:none;padding:4px 0;color:var(--fg)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-left:auto;gap:2px;flex-wrap:wrap}
.seg button{min-height:34px;padding:5px 11px;border-radius:8px;font-size:0.794rem;font-weight:600;color:var(--fg2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.segrow{display:block}.segrow .seg{margin:8px 0 2px}
.stars{display:flex;gap:4px;margin-left:auto}
.stars button{font-size:1.529rem;line-height:1;color:var(--fill);padding:8px 3px}
.stars button.on{color:var(--warm-ink)}
.hint{font-size:0.735rem;color:var(--fg2);margin:-10px 6px 16px}

/* sheets */
#layers{position:fixed;inset:0;pointer-events:none;z-index:50}
.sheet{position:absolute;inset:0;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.shead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 16px 10px;border-bottom:.5px solid var(--line);background:var(--bg)}
.shead b{font:700 1rem var(--round)}
.shead button{color:var(--accent-text);font-weight:600;padding:8px 2px;min-width:56px;min-height:44px}
.shead button:last-child{text-align:right}
.shead button[disabled]{opacity:.4}
.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sbody>.wrap{max-width:640px}

/* boarding pass hero */
.pass{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;position:relative;overflow:hidden}
.pass .fc-top{color:var(--hero-fg2)}
.pass .code small{color:var(--hero-fg2);max-width:30vw}
.pass .path::before{border-color:rgba(255,255,255,.35)}
.pass .path span{background:var(--hero);color:var(--hero-fg2)}
.pass .path .ic{color:var(--warm)}
.pass .code{font-size:2.471rem}
.ptimes{display:flex;justify-content:space-between;margin-top:8px;font:600 0.882rem var(--round);color:var(--hero-fg)}
.perf{border-top:2px dashed rgba(255,255,255,.22);margin:16px -18px 14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-10px}.perf::after{right:-10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pgrid div{min-width:0}
.pgrid small{display:block;font-size:0.647rem;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-fg2)}
.pgrid b{display:block;font:700 1rem var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.photos button,.photos .ph{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--fill);position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:0.882rem;line-height:1}
.photos .add{display:grid;place-items:center;color:var(--accent);aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line)}
.viewer{position:absolute;inset:0;background:rgba(0,0,0,.94);display:grid;place-items:center;pointer-events:auto;z-index:2}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

/* pickers */
.plist .row{padding:10px 16px}
.plist .big{font:800 1.176rem var(--round);width:54px;flex:none}
.plist small{display:block;color:var(--fg2);font-size:0.735rem}
.plist .t{min-width:0;flex:1}
.plist .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stats */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:18px;margin-bottom:12px}
.hero .big{font:800 2.706rem/1 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:0.765rem;color:var(--hero-fg2);margin-top:4px}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.hero.passport{background:linear-gradient(155deg,var(--hero),var(--hero2))}
.hero .ph{display:flex;justify-content:space-between;gap:10px;font:700 0.706rem var(--round);letter-spacing:.09em;color:var(--hero-fg2);margin-bottom:16px}
.hero small{display:block;font-size:0.676rem;letter-spacing:.08em;color:var(--hero-fg2);margin-bottom:3px}
.hero .two{margin-top:0;grid-template-columns:.75fr 1.25fr}.hero .two .big{font-size:2.118rem;white-space:nowrap}.hero .big .u{font-size:1.059rem;letter-spacing:0;font-weight:700}
.hero .three{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-top:20px}.hero .three b{font:800 1.529rem var(--round);letter-spacing:-.02em}
.hero .fun{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);font-size:0.824rem;color:var(--hero-fg2)}
.hero .fun b{color:var(--warm);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.tile b{display:block;font:800 1.647rem/1.05 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile small{color:var(--fg2);font-size:0.765rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:34px;padding:6px 14px;border-radius:999px;background:var(--fill);font-size:0.824rem;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font:700 0.882rem var(--round);display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font:500 0.735rem var(--font);color:var(--fg2)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin:9px 0}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.853rem}
.bar .v{font:700 0.824rem var(--round);font-variant-numeric:tabular-nums;color:var(--fg2)}
.bar .tr{grid-column:1/-1;height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px;background:var(--data)}
.cols{display:flex;align-items:flex-end;gap:3px;height:132px;padding-top:18px}
.cols div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:0.647rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.cols i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--data);min-height:2px}
.cols div.z i{background:var(--fill)}
.cols span{font-size:0.647rem;font-weight:700;color:var(--fg);height:12px}
.rec{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:.5px solid var(--line);font-size:0.853rem}
.rec:first-of-type{border-top:0}
.rec span:first-child{color:var(--fg2);flex:none}
.rec span:last-child{text-align:right;font-weight:600;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* map */
#mapwrap{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--ocean);touch-action:none;overflow:hidden}
#mapsvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mtop{position:absolute;left:0;right:0;top:0;z-index:3;padding:max(12px,env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
.mtop>*{pointer-events:auto}
.mtop .hrow{align-items:flex-start}
.pill{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;box-shadow:var(--shadow)}
.mtitle{font:800 1.647rem var(--round);letter-spacing:-.02em;padding:6px 14px}
.mseg{display:flex;padding:3px;gap:2px}
.mseg button{padding:6px 12px;border-radius:999px;font-size:0.765rem;font-weight:650;color:var(--fg2)}
.mseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mtop .chips{margin-top:10px}
.mtop .chips button{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mtop .chips button[aria-pressed="true"]{background:var(--accent)}
.mbot{position:absolute;left:16px;right:16px;bottom:84px;z-index:3;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mbot>*{pointer-events:auto}
.msum{display:flex;justify-content:space-around;padding:10px 8px;text-align:center}
.msum b{display:block;font:800 1.118rem var(--round);font-variant-numeric:tabular-nums}
.msum small{font-size:0.676rem;color:var(--fg2)}
.msel{padding:12px 16px;display:flex;align-items:center;gap:12px;border-radius:18px;width:100%}
.msel .code{font-size:1.412rem}
.zoom{position:absolute;right:16px;bottom:172px;z-index:3;display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
.zoom button{width:44px;height:44px;display:grid;place-items:center;font-size:1.294rem;font-weight:500}
.zoom button+button{border-top:.5px solid var(--line)}
.lbl-ap{font:700 0.647rem var(--round);fill:var(--fg);paint-order:stroke;stroke:var(--ocean);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}

.seg .ic{width:18px;height:18px}
.clist{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px}
.crow{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 14px}
.srow+.srow{border-top:.5px solid var(--line)}.crow:active{background:var(--fill)}
.clg .al{width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.765rem}.clg img.al.logo{padding:3px}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.c1{display:flex;justify-content:space-between;gap:8px;font-size:0.765rem;color:var(--fg2);white-space:nowrap}.c1 em{font-style:normal;margin-left:8px;opacity:.85}
.c2{font:700 1rem var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.c3{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.al.logo{background:#fff;padding:2px;border-radius:7px;object-fit:contain;border:.5px solid var(--line)}
.bar .n{display:flex;align-items:center;gap:8px;min-width:0}.bar .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .btn{background:rgba(255,255,255,.14);color:#fff}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function dist(a,b){if(!a||!b||isNaN(a.lat)||isNaN(b.lat))return 0;const R=6371,t=Math.PI/180,dA=(b.lat-a.lat)*t,dO=(b.lon-a.lon)*t;

async function saveFile(name,data){
  try{const d=window.claude&&await window.claude.use('downloads');
    if(d){await d.save({filename:name,data});toast('Saved '+name);return true}}catch(e){if(e&&e.code==='declined')return false}
  const mime=/\.json$/.test(name)?'application/json':/\.csv$/.test(name)?'text/csv':/\.png$/.test(name)?'image/png':/\.ics$/.test(name)?'text/calendar':'text/plain';
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{const file=new File([blob],name,{type:blob.type||mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Saved '+name);return true}catch(e){}
  try{await navigator.clipboard.writeText(typeof data==='string'?data:'');toast('Copied to clipboard instead');return true}catch(e){toast('Could not save the file here');return false}}

  T(list.length===1?'flight':'flights',X0+60,py+368,`300 70px ${FONT}`,P.acc);
  const nm=(cfg.name||'').trim();
  const info=[nm?['Holder',nm]:null,['Authority','uFlightly'],['Place of issue',home],['Date of issue',dmy(new Date())],['Logbook since',mon(fd)]].filter(Boolean);
  info.forEach((r,i)=>{const y=py+204+i*46;c.font=`500 28px ${FONT}`;const lw=c.measureText(r[0]+'  ').width;T(r[0],X0+500,y,`500 28px ${FONT}`,P.dim);
    let v=String(r[1]);c.font=`600 28px ${FONT}`;while(c.measureText(v).width>X0+CW-30-(X0+500+lw)&&v.length>3)v=v.slice(0,-1);T(v,X0+500+lw,y,`600 28px ${FONT}`,P.ink)});
  const sy=py+450,cols=[[0,'Distance',fmtNum(distVal(km))+' '+distUnit()],[300,'Flight time',fmtTot(mins)],[520,'Airports',String(apc.size)],[690,'Airlines',String(airN)]];
  cols.forEach(([dx,l,v])=>{T(l,X0+56+dx,sy,`500 27px ${FONT}`,P.dim);T(v,X0+56+dx,sy+54,`700 50px ${FONT}`,P.ink)});
  const ey=sy+96;
  if(!uv){const chips=[`${dom} domestic`,`${list.length-dom} international`,`${lh} long haul`];let cx=X0+56;
    chips.forEach(s=>{c.font=`600 28px ${FONT}`;const w=c.measureText(s).width+44;rr(cx,ey,w,56,28);c.fillStyle=P.chip;c.fill();T(s,cx+22,ey+38,`600 28px ${FONT}`,P.ink);cx+=w+14})}
  else{const lg=[...X].sort((a,b)=>b.km-a.km)[0],ac=count(list,f=>f.aircraft)[0],co2=(km*0.122/1000).toFixed(1);
    const rows=[['Longest',lg&&lg.km?`${apShow(lg.f.from).iata} to ${apShow(lg.f.to).iata} · ${fmtDist(lg.km)}`:'—'],['Top aircraft',ac?ac[0]:'—'],['Footprint',`about ${co2} t CO2`]];
    rows.forEach((r,i)=>{T(r[0].toUpperCase(),X0+56,ey+10+i*36,`600 24px ${FONT}`,P.acc);let v=r[1];c.font=`600 30px ${FONT}`;while(c.measureText(v).width>600&&v.length>4)v=v.slice(0,-1);T(v,X0+300,ey+12+i*36,`600 30px ${FONT}`,P.ink)})}
  const mb=Y0+CH-150;c.fillStyle=P.mrzBg;c.fillRect(X0,mb,CW,150);

  const iss=`ISSUED${dmy(new Date()).replace(/ /g,'')}${home}`;const l2=(iss+'<'.repeat(Math.max(2,42-iss.length-11))+'UFLIGHTLY<<').slice(0,42);
  T(l1,X0+30,mb+62,`600 33px ${MONO}`,P.mrzInk);T(l2,X0+30,mb+110,`600 33px ${MONO}`,P.mrzInk);
  c.restore()}

/* ---------- add an airport by hand ---------- */
function newAirport(cb){
  const ctrs=[...new Set(AP.map(a=>a.country))].sort();
  const el=openSheet(`<div class="shead"><button data-act="close">‹ Back</button><b>New airport</b><button id="apsave">Save</button></div>
   <div class="sbody"><div class="wrap">
   <div class="grp"><div class="row"><label for="n-code">Code</label><input id="n-code" maxlength="4" placeholder="XYZ" autocapitalize="characters" autocomplete="off"></div>
    <div class="row"><label for="n-name">Airport</label><input id="n-name" placeholder="Example Field" autocomplete="off"></div>
    <div class="row"><label for="n-city">City</label><input id="n-city" placeholder="Springfield" autocomplete="off"></div>
    <div class="row"><label for="n-ctry">Country</label><input id="n-ctry" list="dl-ct" placeholder="United States" autocomplete="off"></div></div>
   <div class="gt">Location</div><div class="grp">
    <div class="row"><label for="n-lat">Latitude</label><input id="n-lat" type="number" step="any" inputmode="decimal" placeholder="40.713"></div>
    <div class="row"><label for="n-lon">Longitude</label><input id="n-lon" type="number" step="any" inputmode="decimal" placeholder="-74.006"></div>
    <button class="row link" id="nmap"><span>Pick on a map</span><span class="val"></span></button></div>
   <div class="hint">Use the 3-letter IATA code, or the 4-letter ICAO code. The location is used to draw the route and measure distance.</div>
   <datalist id="dl-ct">${ctrs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div></div>`);
  $('#nmap',el).onclick=()=>mapPicker((la,lo)=>{$('#n-lat').value=la;$('#n-lon').value=lo});
  $('#apsave',el).onclick=()=>{
    const code=$('#n-code').value.trim().toUpperCase(),name=$('#n-name').value.trim(),city=$('#n-city').value.trim(),country=$('#n-ctry').value.trim();
    const lat=parseFloat($('#n-lat').value),lon=parseFloat($('#n-lon').value);
    if(!/^[A-Z0-9]{3,4}$/.test(code)){toast('Enter a 3 or 4 letter airport code');return}
    if(!name&&!city){toast('Enter a name or a city');return}
    if(!(lat>=-90&&lat<=90)||!(lon>=-180&&lon<=180)){toast('Enter a valid latitude and longitude, or pick on the map');return}
    addCustom({iata:code,icao:code.length===4?code:'',name:name||city,city:city||name,country,lat,lon});
    closeSheet();cb(code)}}
function mapPicker(cb){
  const el=openSheet(`<div class="shead"><button data-act="close">‹ Back</button><b>Pick location</b><button id="mpok" disabled>Use</button></div>
   <div style="flex:1;min-height:0;position:relative;background:var(--ocean)"><svg id="pksvg" style="width:100%;height:100%;touch-action:none"><path id="pk-land" fill="var(--land)" stroke="var(--border)" stroke-width=".5"/><circle id="pk-dot" r="7" fill="var(--warm)" stroke="#fff" stroke-width="2" style="display:none"/></svg>
   <div class="hint" style="position:absolute;left:0;right:0;bottom:10px;text-align:center;margin:0">Pinch to zoom, then tap to place the pin</div></div>`);
  const sv=$('#pksvg',el),W=sv.clientWidth||360,H=sv.clientHeight||500;
  if(!window.d3||!WORLD||!window.topojson){toast('The map could not be loaded. Enter the coordinates instead.');closeSheet();return}
  const proj=d3.geoNaturalEarth1().fitExtent([[4,4],[W-4,H-4]],{type:'Sphere'}),s0=proj.scale(),t0=proj.translate(),land=topojson.feature(WORLD,WORLD.objects.land),path=d3.geoPath(proj);
  let t=d3.zoomIdentity,pt=null;const ok=$('#mpok',el);
  const draw=()=>{proj.scale(s0*t.k).translate([t0[0]*t.k+t.x,t0[1]*t.k+t.y]);$('#pk-land',el).setAttribute('d',path(land));
    const dot=$('#pk-dot',el);if(pt){const p=proj([pt[1],pt[0]]);dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);dot.style.display=''}};
  const z=d3.zoom().scaleExtent([1,60]).translateExtent([[-W,-H],[2*W,2*H]]).on('zoom',e=>{t=e.transform;draw()});
  const s=d3.select(sv);s.call(z).on('dblclick.zoom',null);
  sv.addEventListener('click',e=>{const r=sv.getBoundingClientRect();const ll=proj.invert([e.clientX-r.left,e.clientY-r.top]);if(ll&&isFinite(ll[0])&&Math.abs(ll[1])<=90){pt=[ll[1],ll[0]];draw();ok.disabled=false}});
  ok.onclick=()=>{closeSheet();cb(+pt[0].toFixed(4),+pt[1].toFixed(4))};draw()}

/* ---------- events ---------- */
let SW=null;
document.addEventListener('touchstart',e=>{const r=e.target.closest('.srow');if(SW&&SW.el!==r){SW.el.classList.remove('open');SW.el.style.setProperty('--tx','0px');SW=null}if(!r)return;const t=e.touches[0];SW={el:r,x:t.clientX,y:t.clientY,dx:0,lock:null,open:r.classList.contains('open')}},{passive:true});
document.addEventListener('touchmove',e=>{if(!SW)return;const t=e.touches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;if(SW.lock==null&&(Math.abs(dx)>8||Math.abs(dy)>8))SW.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';if(SW.lock!=='x')return;const v=Math.max(-152,Math.min(0,(SW.open?-152:0)+dx));SW.dx=v;const c=SW.el.querySelector('.crow');c.style.transition='none';SW.el.classList.add('sw');SW.el.style.setProperty('--tx',v+'px')},{passive:true});
document.addEventListener('touchend',()=>{if(!SW)return;const c=SW.el.querySelector('.crow');c.style.transition='';if(SW.lock==='x'){const o=SW.dx<-70;SW.el.classList.toggle('open',o);if(!o){const r=SW.el;setTimeout(()=>r.classList.remove('sw'),220)}SW.el.style.setProperty('--tx',o?'-152px':'0px');SW.swiped=Date.now();SW.open=o}},{passive:true});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&D)D[k]=+e.target.value});
document.addEventListener('click',async e=>{
  const t=e.target;
  if(SW&&SW.swiped&&Date.now()-SW.swiped<350){e.preventDefault();return}
  const op=t.closest('.srow.open');if(op&&!t.closest('.swa')){op.classList.remove('open');op.style.setProperty('--tx','0px');SW=null;return}
  const tab=t.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}
  const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;if(S.sort===k)S.dir=S.dir==='desc'?'asc':'desc';else{S.sort=k;S.dir=k==='date'?'desc':'asc'}render(true);return}
  const sy=t.closest('[data-sy]');if(sy){S.sy=sy.dataset.sy;render();return}
  const my=t.closest('[data-my]');if(my){M.year=my.dataset.my;M.sel=null;render();return}
  const sg=t.closest('[data-seg] [data-v]');
  if(sg){const grp=sg.parentElement.dataset.seg,v=sg.dataset.v;
    if(grp==='view'){S.view=v;LS.set('fl.view',v);render(true);return}
    if(grp==='rankby'){S.by=v;render(true);return}
    if(grp==='acf'){S.acf=v;render(true);return}
    if(grp==='units'){cfg.units=v;persistCfg();render();return}
    if(grp==='mapmode'){M.mode=v;M.t=d3.zoomIdentity;M.sel=null;render();return}
    if(D&&grp in D){D[grp]=+v;$$('[data-seg="'+grp+'"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));return}}
  const st=t.closest('[data-star]');if(st&&D){const n=+st.dataset.star;D.rating=D.rating===n?0:n;drawStars();return}
  const rm=t.closest('[data-rm]');if(rm&&D){const id=rm.dataset.rm;D.photos=D.photos.filter(p=>p!==id);if(D._added[id])delete D._added[id];else D._removed.push(id);drawPhotos();return}
  const a=t.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case 'add':form();break;
    case 'open':detail(id);break;
    case 'close':closeSheet();break;
    case 'edit':closeSheet();form(id);break;
    case 'save':saveForm();break;
    case 'pick':{const end=a.dataset.end;pickAirport(D[end],c=>{D[end]=c;fillEnds();estHint()});break}
    case 'addphoto':$('#photofile').click();break;
    case 'photo':{const l=$('#layers').lastElementChild;const v=document.createElement('button');v.className='viewer';v.innerHTML='<img alt="">';l.appendChild(v);PH.get(a.dataset.pid).then(d=>{if(d)v.firstChild.src=d});v.onclick=()=>v.remove();break}
    case 'del':confirmDelete(id);break;
    case 'import':$('#file').click();break;
    case 'seed':{const r=csvToFlights(SEED);const m=merge(r.list,null);render();toast(`Loaded ${m.add} flights`+(m.dup?`, ${m.dup} already there`:''));break}
    case 'export-json':exportJSON();break;
    case 'export-csv':if(!flights.length){toast('No flights to export yet');break}saveFile(`flights-${new Date().toISOString().slice(0,10)}.csv`,flightsToCSV());break;
    case 'wipe':confirmWipe();break;
    case 'snooze':cfg.backupSnooze=Date.now()+7*864e5;persistCfg();render(true);break;
    case 'cancelform':requestCloseForm();break;
    case 'goals':goalSheet();break;
    case 'savegoal':saveGoal();break;
    case 'share':shareSheet();break;
    case 'savesum':{const cv=$('#sumcv');cv.toBlob(b=>b&&saveFile(`uflightly-passport-${PS.label.replace(/\s+/g,'-').toLowerCase()}${PS.uv?'-blacklight':''}.png`,b));break}
    case 'uv':{PS.uv=!PS.uv;a.setAttribute('aria-pressed',PS.uv);drawPassport($('#sumcv'),PS.list,PS.label,PS.uv);break}
    case 'gzin':M.gk=Math.min(4,M.gk*1.4);MR&&MR.draw();break;
    case 'gzout':M.gk=Math.max(.8,M.gk/1.4);MR&&MR.draw();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='set-name'){cfg.name=e.target.value;persistCfg()}

$('#file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;importText(await f.text())});
$('#photofile').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(!D)return;

render();
